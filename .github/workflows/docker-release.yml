name: Build and Push Release Images

on:
  push:
    tags:
      - 'v*'

jobs:
  build-web:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}
      context: .
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}

  build-ws:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: tunaground/openchamchijs-ws-server
      context: ./ws-server
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
