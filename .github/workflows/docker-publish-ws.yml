name: Build and Push WS Server Image

on:
  push:
    branches: [main, feat/docker-cloudfront]
    paths:
      - 'ws-server/**'
  workflow_dispatch:

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: tunaground/openchamchijs-ws-server
      context: ./ws-server
      tags: |
        type=raw,value={{branch}}
        type=raw,value=latest
        type=sha,prefix=
