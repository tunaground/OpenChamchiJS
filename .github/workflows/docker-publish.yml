name: Build and Push Web Image

on:
  push:
    branches: [main, feat/docker-cloudfront]
    paths:
      - '**'
      - '!deploy/**'
      - '!ws-server/**'
      - '!*.md'
      - '!.gitignore'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!deploy/**'
      - '!ws-server/**'
      - '!*.md'
      - '!.gitignore'
  workflow_dispatch:

# A newer push to the same PR/branch cancels the build in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Fork PRs get a read-only token and cannot push to GHCR
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}
      context: .
      # push: <branch>, latest (default branch only), <sha>
      # pull_request: pr-<number>, <sha>
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=raw,value=latest,enable={{is_default_branch}}
        type=sha,prefix=
